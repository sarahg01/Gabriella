<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
    <style>
        /* Basic styles for the product catalog and filter */
        body { font-family: Arial, sans-serif; }
        .filter-bar { margin-bottom: 20px; }
        .filter-bar select { padding: 10px; }
        .product { border: 1px solid #ccc; padding: 10px; margin: 10px; display: inline-block; width: 200px; }
        .product img { max-width: 100%; }
        .product h3 { font-size: 1.2em; }
    </style>
</head>
<body>
    <div class="filter-bar">
        <label for="category">Filter by Category:</label>
        <select id="category">
            <option value="all">All</option>
            <option value="makeup">Makeup</option>
            <option value="skincare">Skincare</option>
            <option value="haircare">Haircare</option>
            <option value="fragrances">Fragrances</option>
            <option value="prestige">Prestige Brands</option>
        </select>
    </div>
    <div id="product-list">
        <!-- Placeholder for products -->
    </div>
    <script>
        const products = [
            // Example luxury products
            { name: 'Luxury Lipstick', category: 'makeup', image: 'lipstick.jpg' },
            { name: 'Luxury Conditioner', category: 'haircare', image: 'conditioner.jpg' },
            { name: 'Luxury Perfume', category: 'fragrances', image: 'perfume.jpg' },
            // Add 50+ more products here
        ];

        function displayProducts(category) {
            const productList = document.getElementById('product-list');
            productList.innerHTML = '';
            const filteredProducts = category === 'all' ? products : products.filter(product => product.category === category);
            filteredProducts.forEach(product => {
                const productDiv = document.createElement('div');
                productDiv.classList.add('product');
                productDiv.innerHTML = `<img src='${product.image}' alt='${product.name}' /><h3>${product.name}</h3>`;
                productList.appendChild(productDiv);
            });
        }

        document.getElementById('category').addEventListener('change', function() {
            displayProducts(this.value);
        });

        // Initial display of products
        displayProducts('all');
    </script>
</body>
</html>
