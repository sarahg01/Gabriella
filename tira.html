// Render product cards dynamically
function renderProducts() {
    const grid = document.getElementById("productGrid");
    grid.innerHTML = products.map((p, i) => `
        <div class="product-card">
            <button class="eye-btn" onclick="openPopup(${i})" aria-label="Quick view">
                <svg viewBox="0 0 24 24" fill="none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="#333" stroke-width="2"/></svg>
            </button>
            <img src="${p.images[0]}" alt="${p.title}" loading="lazy">
            <h3>${p.title}<span class="price-tag">${p.offer}</span></h3>
            <a href="${p.link}" class="buy-btn" target="_blank" rel="nofollow noopener">Buy on Tira</a>
        </div>
    `).join("");
}
renderProducts();

function handleSearch(query) {
    const resultsEl = document.getElementById("searchResults");
    const q = query.trim().toLowerCase();
    if (!q) { resultsEl.classList.remove("open"); resultsEl.innerHTML = ""; return; }
    const matchedNav = navLinks.filter(n => n.name.toLowerCase().includes(q));
    const matchedProducts = products.map((p,i) => ({...p,index:i})).filter(p => p.title.toLowerCase().includes(q)).slice(0,6);
    if (matchedNav.length === 0 && matchedProducts.length === 0) {
        resultsEl.innerHTML = '<div class="search-no-result">No results for "' + query + '"</div>';
        resultsEl.classList.add("open"); return;
    }
    let html = "";
    matchedNav.forEach(n => { html += '<a class="search-result-item" href="' + n.url + '"><div style="width:42px;height:42px;display:flex;align-items:center;justify-content:center;background:#f7f7f7;border-radius:6px;flex-shrink:0;font-size:18px;font-weight:700;color:#C8102E;">↗</div><div><div class="search-result-name">' + n.name + '</div><div class="search-result-price" style="color:#888;">Page</div></div></a>'; });
    matchedProducts.forEach(p => { html += '<div class="search-result-item" onclick="openPopup(' + p.index + '); closeSearchResults();"><img src="' + p.images[0] + '" alt=""><div><div class="search-result-name">' + p.title + '</div><div class="search-result-price">' + p.offer + '</div></div></div>'; });
    resultsEl.innerHTML = html;
    resultsEl.classList.add("open");
}
function closeSearchResults() { document.getElementById("searchResults").classList.remove("open"); document.getElementById("searchInput").value = ""; }
document.addEventListener("click", function(e) { if (!e.target.closest(".search-wrap")) document.getElementById("searchResults").classList.remove("open"); });

let currentSlide = 0, totalSlides = 0;
function openPopup(index) {
    const p = products[index];
    currentSlide = 0; totalSlides = p.images.length;
    document.getElementById("popupBadge").style.display = p.badge ? "block" : "none";
    const slidesEl = document.getElementById("popupSlides");
    slidesEl.innerHTML = p.images.map(src => '<img src="' + src + '" alt="' + p.title + '">').join("");
    slidesEl.style.transform = "translateX(0)";
    const dotsEl = document.getElementById("sliderDots");
    dotsEl.innerHTML = p.images.map((_,i) => '<div class="dot ' + (i===0?'active':'') + '" onclick="goToSlide(' + i + ')"></div>').join("");
    const showArrows = totalSlides > 1;
    document.querySelector(".slider-arrow.prev").style.display = showArrows ? "flex" : "none";
    document.querySelector(".slider-arrow.next").style.display = showArrows ? "flex" : "none";
    document.getElementById("popupSku").textContent = p.sku;
    document.getElementById("popupTitle").textContent = p.title;
    document.getElementById("popupStars").innerHTML = '<span class="star-filled">' + "★".repeat(p.stars) + '</span><span class="star-empty">' + "★".repeat(5-p.stars) + '</span>';
    document.getElementById("popupOffer").textContent = p.offer;
    document.getElementById("popupMrp").textContent = (p.mrp && p.mrp !== p.offer) ? "MRP " + p.mrp : "";
    document.getElementById("popupDiscount").textContent = p.discount || "";
    document.getElementById("popupDesc").textContent = p.desc;
    document.getElementById("popupSize").textContent = p.size;
    document.getElementById("popupBuyBtn").href = p.link;
    document.getElementById("popupOverlay").classList.add("open");
    document.body.style.overflow = "hidden";
}
function closePopup() { document.getElementById("popupOverlay").classList.remove("open"); document.body.style.overflow = ""; }
function handleOverlayClick(e) { if (e.target === document.getElementById("popupOverlay")) closePopup(); }
function slideMove(dir) { currentSlide = (currentSlide+dir+totalSlides)%totalSlides; goToSlide(currentSlide); }
function goToSlide(n) { currentSlide = n; document.getElementById("popupSlides").style.transform = "translateX(-" + (n*100) + "%)"; document.querySelectorAll(".dot").forEach((d,i) => d.classList.toggle("active", i===n)); }
let touchStartX = 0;
document.getElementById("popupSlides").addEventListener("touchstart", e => { touchStartX = e.touches[0].clientX; });
document.getElementById("popupSlides").addEventListener("touchend", e => { const diff = touchStartX - e.changedTouches[0].clientX; if (Math.abs(diff) > 40) slideMove(diff > 0 ? 1 : -1); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closePopup(); });
function openMenu() { document.getElementById("sideMenu").classList.add("open"); document.getElementById("overlay").classList.add("active"); document.body.style.overflow = "hidden"; }
function closeMenu() { document.getElementById("sideMenu").classList.remove("open"); document.getElementById("overlay").classList.remove("active"); document.body.style.overflow = ""; }
</script>
  

</body>
</html>
