        .slider-arrow:hover { background: #e91e63; color: white; }
        .slider-arrow.prev { left: 10px; }

        .slider-dots { display: flex; justify-content: center; gap: 7px; padding: 10px 0 6px; background: #f7f7f7; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; cursor: pointer; transition: 0.2s; }

        .popup-details { padding: 18px 22px 24px; font-family: 'Lato', sans-serif; }
        .popup-details .sku { font-size: 12px; color: #999; margin-bottom: 5px; }

        .popup-price { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 3px; }
        .popup-price .offer { font-size: 22px; font-weight: bold; color: #111; }
        .popup-price .mrp { font-size: 14px; color: #aaa; text-decoration: line-through; }
        .popup-price .discount { font-size: 12px; background: #f0f0f0; color: #666; padding: 3px 10px; border-radius: 20px; }
        .popup-tax { font-size: 12px; color: #999; margin-bottom: 15px; }
        .popup-desc { font-size: 14px; color: #444; line-height: 1.65; margin-bottom: 16px; border-top: 1px solid #f0f0f0; padding-top: 14px; }

        .size-box { display: inline-block; border: 1.5px solid #333; padding: 8px 22px; border-radius: 6px; font-size: 14px; color: #333; margin-bottom: 18px; }
        .popup-buy-btn { display: block; width: 100%; padding: 14px; background: #e91e63; color: white; text-align: center; text-decoration: none; border-radius: 8px; font-size: 15px; font-family: 'Lato', sans-serif; font-weight: bold; letter-spacing: 1px; transition: 0.3s; min-height: 50px; line-height: 1.4; }
        .popup-buy-btn:hover { background: #c2185b; }
        footer { text-align: center; padding: 20px 15px; margin-top: 30px; font-size: 14px; line-height: 1.6; font-family: 'Lato', sans-serif; color: #555; }
        @media (max-width: 768px) { .page-title { font-size: 24px; margin: 40px 0 25px; } .product-grid { grid-template-columns: 1fr 1fr; gap: 20px; padding: 0 20px 60px; } .placeholder-img { height: 180px; } .buy-btn { font-size: 13px; padding: 8px 14px; } .search-wrap { max-width: 220px; } }
        @media (max-width: 480px) { .navbar { padding: 12px 14px; } .search-wrap { max-width: 180px; padding: 6px 12px; } .page-title { font-size: 20px; margin: 30px 0 20px; } .product-grid { grid-template-columns: 1fr; gap: 15px; padding: 0 15px 50px; } .product-card { padding: 15px; } .placeholder-img { height: 200px; } footer { font-size: 12px; } .popup-overlay { align-items: flex-end; padding: 0; } .popup-box { max-width: 100%; border-radius: 18px 18px 0 0; } .search-results { width: 260px; right: -10px; } }
    </style>

<body>

<div class="navbar">
    <button class="menu-icon" onclick="openMenu()" aria-label="Open menu">&#9776;</button>
    <div class="search-wrap" style="position:relative;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="8" stroke="#888" stroke-width="2"/><path d="M21 21l-4.35-4.35" stroke="#888" stroke-width="2" stroke-linecap="round"/></svg>
        <input class="search-input" id="searchInput" type="text" placeholder="Search products..." autocomplete="off" oninput="handleSearch(this.value)" onfocus="handleSearch(this.value)">
        <div class="search-results" id="searchResults"></div>
    </div>
</div>
<div class="overlay" id="overlay" onclick="closeMenu()"></div>
<div class="side-menu" id="sideMenu">
    <button class="close-btn" onclick="closeMenu()" aria-label="Close menu">&times;</button>
    <a href="index.html">Home</a>
    <a href="About.html">About</a>
    <a href="skinn.html">SKINN</a>
    <a href="contact.html">Contact</a>
</div>

<h1 class="page-title">Dot &amp; Key ✨</h1>
<div class="product-grid" id="productGrid"></div>

<!-- QUICK VIEW POPUP -->
<div class="popup-overlay" id="popupOverlay" onclick="handleOverlayClick(event)">
    <div class="popup-box" id="popupBox">
        <button class="popup-close" onclick="closePopup()">&times;</button>
        <div class="slider-wrap">
            <span class="new-badge" id="popupBadge" style="display:none;">New Drop</span>
            <div class="slides" id="popupSlides"></div>
            <button class="slider-arrow prev" onclick="slideMove(-1)" style="display:none;">&#8249;</button>
            <button class="slider-arrow next" onclick="slideMove(1)" style="display:none;">&#8250;</button>
            <div class="slider-dots" id="sliderDots"></div>
        </div>
        <div class="popup-details">
            <div class="sku" id="popupSku"></div>
            <h2 id="popupTitle"></h2>
            <div class="popup-stars" id="popupStars"></div>
            <div class="popup-price">
                <span class="offer" id="popupOffer"></span>
                <span class="mrp" id="popupMrp"></span>
                <span class="discount" id="popupDiscount"></span>
            </div>
            <div class="popup-tax">(Inclusive of all taxes)</div>
            <div class="popup-desc" id="popupDesc"></div>
            <div class="size-label">Size</div>
            <div class="size-box" id="popupSize"></div>
            <a class="popup-buy-btn" id="popupBuyBtn" target="_blank" rel="nofollow noopener">BUY ON DOT &amp; KEY</a>
        </div>
    </div>
</div>

<footer>
    <p>Disclaimer: GT is an affiliate of Dot &amp; Key.<br>
    We earn a small commission if you purchase through our links at no extra cost to you.</p>
    <p style="margin-top:8px;">&copy; 2026 Gabriella</p>
</footer>

<script>
// ── Products: all 63 cards empty except card 59 (index 58) which has an affiliate link placeholder ──
const products = Array.from({length: 63}, (_, i) => ({
    sku:     "DK" + String(i + 1).padStart(2, "0"),
    stars:   5,
    badge:   false,
    title:   "Product Name",
    offer:   "₹000",
    mrp:     "",
    discount:"",
    size:    "–",
    desc:    "Product description coming soon.",
    link:    i === 58 ? "YOUR_AFFILIATE_LINK_HERE" : "#"   // card 59 = index 58
}));

// ── Render cards ──
(function renderCards() {
    const grid = document.getElementById("productGrid");
    products.forEach((p, i) => {
        const card = document.createElement("div");
        card.className = "product-card";
        card.innerHTML = `
            <button class="eye-btn" onclick="openPopup(${i})" aria-label="Quick view">
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="12" cy="12" r="3" stroke="#333" stroke-width="2"/>
                </svg>
            </button>
            <div class="placeholder-img"><span>Product Image</span></div>
            <div class="placeholder-bar" style="height:16px;width:80%;"></div>
            <div class="placeholder-bar" style="height:13px;width:55%;margin-top:8px;"></div>
            <a href="${p.link}" class="buy-btn" ${p.link !== "#" ? 'target="_blank" rel="nofollow noopener"' : ""}>Buy on Dot &amp; Key</a>`;
        grid.appendChild(card);
    });
})();

// ── Search ──
const navLinks = [
    {name:"Home",url:"index.html"},
    {name:"About",url:"About.html"},
    {name:"SKINN",url:"skinn.html"},
    {name:"Contact",url:"contact.html"}
];
function handleSearch(query) {
    const resultsEl = document.getElementById("searchResults");
    const q = query.trim().toLowerCase();
    if (!q) { resultsEl.classList.remove("open"); resultsEl.innerHTML = ""; return; }
    const matched = navLinks.filter(n => n.name.toLowerCase().includes(q));
    if (!matched.length) {
        resultsEl.innerHTML = '<div class="search-no-result">No results for "' + query + '"</div>';
    } else {
        resultsEl.innerHTML = matched.map(n =>
            `<a class="search-result-item" href="${n.url}">
                <div style="width:42px;height:42px;display:flex;align-items:center;justify-content:center;background:#f7f7f7;border-radius:6px;font-size:20px;">🔗</div>
                <div><div class="search-result-name">${n.name}</div><div class="search-result-price" style="color:#888;">Page</div></div>
            </a>`).join("");
    }
    resultsEl.classList.add("open");
}
document.addEventListener("click", e => { if (!e.target.closest(".search-wrap")) document.getElementById("searchResults").classList.remove("open"); });

// ── Popup ──
let currentSlide = 0, totalSlides = 0;
function openPopup(index) {
    const p = products[index];
    document.getElementById("popupSku").textContent = p.sku;
    document.getElementById("popupTitle").textContent = p.title;
    document.getElementById("popupStars").innerHTML =
        '<span class="star-filled">' + "★".repeat(p.stars) + '</span>' +
        '<span class="star-empty">' + "★".repeat(5 - p.stars) + '</span>';
    document.getElementById("popupOffer").textContent = p.offer;
    document.getElementById("popupMrp").textContent = "";
    document.getElementById("popupDiscount").textContent = p.discount;
    document.getElementById("popupDesc").textContent = p.desc;
    document.getElementById("popupSize").textContent = p.size;
    document.getElementById("popupBuyBtn").href = p.link;
    // Placeholder slide
    document.getElementById("popupSlides").innerHTML =
        `<div style="min-width:100%;height:280px;background:#f5f5f5;display:flex;align-items:center;justify-content:center;color:#c0c0c0;font-size:13px;font-family:'Lato',sans-serif;letter-spacing:.5px;">Product Image</div>`;
    document.getElementById("popupOverlay").classList.add("open");
    document.body.style.overflow = "hidden";
}
function closePopup() { document.getElementById("popupOverlay").classList.remove("open"); document.body.style.overflow = ""; }
function handleOverlayClick(e) { if (e.target === document.getElementById("popupOverlay")) closePopup(); }
function slideMove() {}  // no-op — single placeholder image
document.addEventListener("keydown", e => { if (e.key === "Escape") closePopup(); });

// ── Side menu ──
function openMenu() { document.getElementById("sideMenu").classList.add("open"); document.getElementById("overlay").classList.add("active"); document.body.style.overflow = "hidden"; }
function closeMenu() { document.getElementById("sideMenu").classList.remove("open"); document.getElementById("overlay").classList.remove("active"); document.body.style.overflow = ""; }
</script>

</body>
